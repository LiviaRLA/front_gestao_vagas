<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script> <!--https://cdn.tailwindcss.com-->
    <title>Company Registration</title>
</head>
<body class="bg-sky-950 h-screen flex flex-col items-center justify-start">
    <div class="text-white max-w-screen text-center py-8">
        <h1 class="text-4xl md:text-6xl">Vacancy Management (Enterprise)</h1>
    </div>
    <form id="submitForm" th:action="@{/company/create}" class="flex gap-24" method="post" th:object="${company}">
    
        <div class="space-y-8 bg-zinc-950 rounded-md p-10">
            <p class="text-gray-100">Register your company</p>
            <p class="text-red-400 hidden" id="passwordError">Passwords are different</p>

            <div class="flex flex-row gap-10">
                <input type="text" name="name" th:field="*{name}"
                    class="bg-gray-100 text-gray-900 text-xd rounded w-96 block p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Name">
                <input type="text" name="username" th:field="*{username}"
                    class="bg-gray-100 text-gray-900 text-xd rounded w-96 block p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Username">
            </div>

            <div class="flex flex-row gap-10">
                <input type="email" name="email" th:field="*{email}"
                    class="bg-gray-100 text-gray-900 text-xd rounded w-96 block p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Email">
                <input type="text" name="website" th:field="*{website}"
                    class="bg-gray-100 text-gray-900 text-xd rounded w-96 block p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Website">
            </div>

            <div class="flex flex-row gap-10">
                <input id="password" type="password" name="password" th:field="*{password}"
                    class="bg-gray-100 text-gray-900 text-xd rounded w-96 block p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Password">
                <input id="confirmPassword" type="password" name="confirmPassword" 
                    class="bg-gray-100 text-gray-900 text-xd rounded w-96 block p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="Repeat your password">
            </div>

            <textarea name="description" th:field="*{description}" class="bg-gray-100 text-gray-900 text-xd rounded w-96 block p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="About you..."></textarea>
            <p class="text-red-400" th:if="${error_message}" th:text="${error_message}"></p>
            <button class="bg-blue-800 text-gray-100 w-full p-3 rounded hover:bg-blue-500">Sign up</button>
            <div class="flex items-center justify-center mt-4">
                <p class="text-gray-100 mr-2">Already have an account? </p>
                <a href="/company/login" class="text-center text-blue-800 underline underline-offset-2 block hover:text-blue-500"> Login </a>
            </div>
            
            
        </div>
    </form>
    
</body>

<script>
    document.getElementById("submitForm").addEventListener("submit", (event) => {
        var password = document.getElementById("password").value;
        var confirmPassword = document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            document.getElementById("passwordError").classList.remove("hidden");
            event.preventDefault();
        }

    })

</script>

</html>
