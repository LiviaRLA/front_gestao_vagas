<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script> <!--https://cdn.tailwindcss.com-->
    <title>Company Login</title>
</head>
<body class="bg-sky-950 h-screen flex flex-col items-center justify-start">
    <div class="text-white max-w-screen text-center py-8">
        <h1 class="text-3xl md:text-5xl mb-2">Vacancy Management</h1>
        <h2 class="text-xl md:text-2xl">(Enterprise)</h2>
    </div>
    <form th:action="@{/company/signIn}" class="flex flex-col items-center justify-center w-full md:w-auto px-4 md:px-0" method="post">

        <div class="space-y-6 bg-zinc-950 rounded-md p-6 md:p-10 w-full md:w-auto max-w-md">

            <p class="text-red-400 text-center" th:if="${error_message}" th:text="${error_message}"></p>
            <input type="text" name="username" 
                class="bg-gray-100 text-gray-900 text-sm md:text-base rounded w-full block p-2 md:p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Username">
            <input type="password" name="password" 
                class="bg-gray-100 text-gray-900 text-sm md:text-base rounded w-full block p-2 md:p-3 focus:outline-none focus:ring-2 focus:ring-blue-500"
                placeholder="Password">
            <button class="bg-blue-800 text-gray-100 w-full sm:w-92 p-3 rounded hover:bg-blue-500 ">Login</button>
            <a href="/company/create" class="text-center text-blue-800 underline underline-offset-2 block hover:text-blue-500 mt-4"> Create your account </a>
        </div>
    </form>
    
</body>
</html>
